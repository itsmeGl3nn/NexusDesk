services:
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - FLOCI_SERVICES_DOCKER_NETWORK=nexusdesk-local
      - FLOCI_HOSTNAME=floci
      - FLOCI_BASE_URL=http://floci:4566
      - FLOCI_STORAGE_MODE=hybrid
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - floci_data:/app/data
    networks:
      - contact-center-network

  frontend:
    profiles: [frontend]
    image: node:22-alpine
    working_dir: /app
    container_name: contact-center-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
      - BACKEND_API_URL=${BACKEND_API_URL:-http://host.docker.internal:3000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    networks:
      - contact-center-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - contact-center-network

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - CHROMA_PERSIST_PATH=/data
    volumes:
      - chroma_data:/data
    networks:
      - contact-center-network

networks:
  contact-center-network:
    name: nexusdesk-local
    driver: bridge

volumes:
  floci_data:
  ollama_data:
  chroma_data:
