AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Custom Contact Center - Serverless Backend

Parameters:
  AwsEndpoint:
    Type: String
    Default: ''
    Description: AWS endpoint reachable from Lambda containers; empty for real AWS.

Conditions:
  IsLocal: !Not [!Equals [!Ref AwsEndpoint, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 128
    Environment:
      Variables:
        AWS_ENDPOINT: !Ref AwsEndpoint
        IS_LOCAL: !If [IsLocal, 'true', 'false']
        TABLE_NAME: !Ref TicketsTable
        USERS_TABLE: !Ref UsersTable
        TICKETS_TABLE: !Ref TicketsTable
        CALLS_TABLE: !Ref CallsTable
        LOGS_TABLE: !Ref LogsTable
        TENANTS_TABLE: !Ref TenantsTable
        COGNITO_USER_POOL_ID: !Ref CognitoUserPool
        COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient

Resources:

  AttachmentsBucket:
    Type: AWS::S3::Bucket

  PingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: ping.handler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /ping
            Method: get

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Tickets
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CallsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Calls
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  LogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Logs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Tenants
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ============================================================
  # Cognito User Pool
  # ============================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ContactCenterUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: tenantId
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "256"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ContactCenterClient
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, name, 'custom:tenantId']
      WriteAttributes: [name]

  CognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref CognitoUserPool
      Description: Full access — manage users, settings, and all resources
      Precedence: 1

  CognitoSupervisorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: supervisor
      UserPoolId: !Ref CognitoUserPool
      Description: Can view users, manage agents, and view reports
      Precedence: 2

  CognitoAgentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: agent
      UserPoolId: !Ref CognitoUserPool
      Description: Basic agent access — handle contacts
      Precedence: 3

  # ============================================================
  # IAM — shared policy for Lambda → DynamoDB
  # ============================================================
  DynamoDBCrudPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ContactCenterDynamoDBCrud
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt UsersTable.Arn
              - !GetAtt TicketsTable.Arn
              - !GetAtt CallsTable.Arn
              - !GetAtt LogsTable.Arn
              - !GetAtt TenantsTable.Arn

  CognitoProvisionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminSetUserPassword
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:AdminDeleteUser
            Resource: !GetAtt CognitoUserPool.Arn

  # ============================================================
  # Lambda Functions
  # ============================================================
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CreateUserFunction
      CodeUri: ../backend/dist/handlers
      Handler: user.createUser
      Architectures:
        - x86_64
      Policies:
        - !Ref DynamoDBCrudPolicy
        - !Ref CognitoProvisionPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /users
            Method: post

  ListUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ListUsersFunction
      CodeUri: ../backend/dist/handlers
      Handler: user.listUsers
      Architectures:
        - x86_64
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /users
            Method: get

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetUserFunction
      CodeUri: ../backend/dist/handlers
      Handler: user.getUser
      Architectures:
        - x86_64
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /users/{userId}
            Method: get

  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateUserFunction
      CodeUri: ../backend/dist/handlers
      Handler: user.updateUser
      Architectures:
        - x86_64
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /users/{userId}
            Method: patch

  GetMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetMeFunction
      CodeUri: ../backend/dist/handlers
      Handler: user.getMe
      Architectures:
        - x86_64
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /me
            Method: get

  CreateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CreateTicketFunction
      CodeUri: ../backend/dist/handlers
      Handler: ticket.createTicket
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets
            Method: post
        Singular:
          Type: Api
          Properties:
            Path: /ticket
            Method: post

  ListTicketsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ListTicketsFunction
      CodeUri: ../backend/dist/handlers
      Handler: ticket.listTickets
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets
            Method: get

  GetTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetTicketFunction
      CodeUri: ../backend/dist/handlers
      Handler: ticket.getTicket
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets/{ticketId}
            Method: get
        Singular:
          Type: Api
          Properties:
            Path: /ticket/{id}
            Method: get

  UpdateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UpdateTicketFunction
      CodeUri: ../backend/dist/handlers
      Handler: ticket.updateTicket
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tickets/{ticketId}
            Method: patch
        Singular:
          Type: Api
          Properties:
            Path: /ticket/{id}
            Method: put

  DeleteTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: ticket.deleteTicketHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /ticket/{id}
            Method: delete

  StartCallFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: call.startCallHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /call
            Method: post

  ListCallsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: call.listCallsHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /calls
            Method: get

  UpdateCallFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: call.updateCallHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /call/{id}
            Method: put

  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: log.createNoteHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /notes
            Method: post

  ListNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: log.listNotesHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /notes
            Method: get

  UpdateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: log.updateNoteHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /notes/{id}
            Method: put

  DeleteNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: log.deleteNoteHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /notes/{id}
            Method: delete

  ListLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: log.getLogsHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /logs
            Method: get

  AuditLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: log.auditLogHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /logs
            Method: post

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: auth.logoutHandler
      Policies:
        - !Ref DynamoDBCrudPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/logout
            Method: post

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers
      Handler: auth.register
      Policies:
        - !Ref DynamoDBCrudPolicy
        - !Ref CognitoProvisionPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post

  # ============================================================
  # Auth Lambda Functions (public — no Cognito authorizer)
  # ============================================================
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LoginFunction
      CodeUri: ../backend/dist/handlers
      Handler: auth.login
      Policies:
        - !Ref DynamoDBCrudPolicy
      Architectures:
        - x86_64
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post

  SignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SignupFunction
      CodeUri: ../backend/dist/handlers
      Handler: auth.signup
      Policies:
        - !Ref DynamoDBCrudPolicy
        - !Ref CognitoProvisionPolicy
      Architectures:
        - x86_64
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/signup
            Method: post

  ConfirmSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ConfirmSignupFunction
      CodeUri: ../backend/dist/handlers
      Handler: auth.confirmSignup
      Policies:
        - !Ref DynamoDBCrudPolicy
      Architectures:
        - x86_64
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/confirm
            Method: post

  RefreshTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RefreshTokenFunction
      CodeUri: ../backend/dist/handlers
      Handler: auth.refresh
      Policies:
        - !Ref DynamoDBCrudPolicy
      Architectures:
        - x86_64
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/refresh
            Method: post

  # ============================================================
  # Tenant Registration (public — provisions tenant + admin user)
  # ============================================================
  RegisterTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RegisterTenantFunction
      CodeUri: ../backend/dist/handlers
      Handler: tenant.registerTenant
      Architectures:
        - x86_64
      Policies:
        - !Ref DynamoDBCrudPolicy
        - !Ref CognitoProvisionPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /tenants/register
            Method: post

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !If
      - IsLocal
      - !Sub 'http://localhost:4566/restapis/${ServerlessRestApi}/Prod/_user_request_'
      - !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod'
  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
  UsersTableArn:
    Description: Users DynamoDB table ARN
    Value: !GetAtt UsersTable.Arn
  # TicketsTableArn:
  #   Description: Tickets DynamoDB table ARN
  #   Value: !GetAtt TicketsTable.Arn
  # CallsTableArn:
  #   Description: Calls DynamoDB table ARN
  #   Value: !GetAtt CallsTable.Arn
  # LogsTableArn:
  #   Description: Logs DynamoDB table ARN
  #   Value: !GetAtt LogsTable.Arn
  # TenantsTableArn:
  #   Description: Tenants DynamoDB table ARN
  #   Value: !GetAtt TenantsTable.Arn
